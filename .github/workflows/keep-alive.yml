# Demo hosting only: wakes the API if a free host put it to sleep.
# The API also pings itself (IC_KEEP_ALIVE_URL); this outside ping is the backup,
# because a sleeping app cannot wake itself.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
#   New repository variable  KEEP_ALIVE_URL = https://<your-api-host>/health
# Without that variable the job does nothing.
#
# GitHub runs schedules only from the default branch, may start them late at busy
# times, and pauses them after 60 days with no commits (re-enable in the Actions tab).
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        env:
          URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEP_ALIVE_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping free instance can take about a minute to start: allow 2 minutes, retry 3 times.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors "$URL"
